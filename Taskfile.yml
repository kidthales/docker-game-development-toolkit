version: '3'

vars:
  DOCKER_BAKE: touch .env && docker buildx bake -f .env -f docker-bake.hcl

tasks:
  default:
    desc: Display available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: 'Build toolkit images (pass extra bake args after --; e.g. task build -- --no-cache --pull gdtk-non-free)'
    cmds:
      - '{{.DOCKER_BAKE}} {{.CLI_ARGS}}'

  test:
    desc: Run unit tests and smoke tests against built local images
    cmds:
      - task: test:unit
      - task: test:gdtk
      - |
        if docker image inspect "${IMAGES_PREFIX:-}gdtk-non-free:latest" >/dev/null 2>&1; then
          docker run --rm "${IMAGES_PREFIX:-}gdtk-non-free:latest" aseprite --version
        fi

  test:unit:
    desc: Run unit and boundary regression tests
    cmds:
      - bash tests/toolkit_test.sh

  test:gdtk:
    desc: Run smoke tests against built free toolkit image
    cmds:
      - docker run --rm "${IMAGES_PREFIX:-}gdtk:latest" tiled --version
      - docker run --rm -u 1000:1000 "${IMAGES_PREFIX:-}gdtk:latest" tiled --version
      - docker run --rm "${IMAGES_PREFIX:-}gdtk:latest" tile-extruder --version
      - docker run --rm "${IMAGES_PREFIX:-}gdtk:latest" yaml --help

  test:non-free:
    desc: Run smoke tests against built non-free image
    cmds:
      - docker run --rm "${IMAGES_PREFIX:-}gdtk-non-free:latest" aseprite --version

  lint:
    desc: Run all static analysis checks (BuildKit check, Hadolint, Actionlint, ShellCheck, EditorConfig)
    deps: [lint:bake, lint:dockerfile, lint:actions, lint:shellcheck, lint:editorconfig]

  lint:bake:
    desc: Validate docker-bake.hcl and Dockerfile via BuildKit check
    cmds:
      - '{{.DOCKER_BAKE}} --call=check gdtk gdtk-non-free'

  lint:dockerfile:
    desc: Lint Dockerfile with Hadolint
    cmds:
      - docker run --rm -i -v "{{.ROOT_DIR}}/.hadolint.yaml:/.hadolint.yaml:ro" hadolint/hadolint < Dockerfile

  lint:actions:
    desc: Lint GitHub Actions workflows with Actionlint
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo:ro" -w /repo rhysd/actionlint -color

  lint:shellcheck:
    desc: Lint shell scripts with ShellCheck
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/mnt:ro" -w /mnt koalaman/shellcheck:stable tests/toolkit_test.sh

  lint:editorconfig:
    desc: Verify file formatting and line endings against .editorconfig
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/check:ro" mstruebing/editorconfig-checker

  print:
    desc: Print resolved docker-bake.hcl configuration
    cmds:
      - '{{.DOCKER_BAKE}} --print gdtk gdtk-non-free'
