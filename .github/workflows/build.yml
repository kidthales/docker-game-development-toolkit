name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: ~
  repository_dispatch:
    types: [aseprite-published]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-gdtk:
    name: Build Free Toolkit (gdtk) and Push to ghcr.io/${{ github.repository_owner }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          targets: gdtk
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          source: .
          set: |
            *.cache-from=type=gha,scope=gdtk
            *.cache-to=type=gha,mode=max,scope=gdtk
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/

      - name: Run Trivy Vulnerability Scanner (gdtk)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gdtk:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'

  build-gdtk-non-free:
    name: Build Non-Free Toolkit (gdtk-non-free) and Push to ghcr.io/${{ github.repository_owner }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          targets: gdtk-non-free
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          source: .
          set: |
            *.cache-from=type=gha,scope=gdtk-non-free
            *.cache-to=type=gha,mode=max,scope=gdtk-non-free
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/

      - name: Run Trivy Vulnerability Scanner (gdtk-non-free)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gdtk-non-free:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'
