name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
  workflow_dispatch: ~
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Task Lint
        if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        run: task lint
      - name: Run Task Lint (Untrusted PR - Public Targets Only)
        if: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          task lint:dockerfile lint:actions lint:shellcheck lint:editorconfig
          touch .env
          docker buildx bake -f .env -f docker-bake.hcl --call=check gdtk
      - name: Run Unit Tests
        run: task test:unit

  build-gdtk:
    name: Build Free Toolkit (gdtk - ${{ matrix.arch }}) and Push to ghcr.io/${{ github.repository_owner }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ephemeral sha-*-<arch> tags are pruned after 30 days by .github/workflows/clean.yml.
      - uses: docker/bake-action@v7
        with:
          targets: gdtk
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          source: .
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=gdtk-${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=gdtk-${{ matrix.arch }}
            gdtk.tags=ghcr.io/${{ github.repository_owner }}/gdtk:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.sha, matrix.arch) || format('sha-{0}-{1}', github.sha, matrix.arch) }}
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/

      - name: Run Smoke Tests (gdtk)
        if: github.event_name == 'pull_request'
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/
          IMAGES_TAG: pr-${{ github.sha }}-${{ matrix.arch }}
        run: task test:gdtk

      - name: Run Trivy Vulnerability Scanner (gdtk)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gdtk:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.sha, matrix.arch) || format('sha-{0}-{1}', github.sha, matrix.arch) }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'

  merge-gdtk:
    name: Merge Multi-Arch Manifest (gdtk)
    needs: build-gdtk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and Push Multi-Arch Manifest (gdtk)
        env:
          PREFIX: ghcr.io/${{ github.repository_owner }}/gdtk
          SHA_TAG: sha-${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          ARGS=(-t "${PREFIX}:latest")
          if [ -n "$RELEASE_TAG" ]; then
            ARGS+=(-t "${PREFIX}:${RELEASE_TAG}")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "${PREFIX}:${SHA_TAG}-amd64" \
            "${PREFIX}:${SHA_TAG}-arm64"

  build-gdtk-non-free:
    name: Build Non-Free Toolkit (gdtk-non-free - ${{ matrix.arch }}) and Push to ghcr.io/${{ github.repository_owner }}
    needs: lint
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ephemeral sha-*-<arch> tags are pruned after 30 days by .github/workflows/clean.yml.
      - uses: docker/bake-action@v7
        with:
          targets: gdtk-non-free
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          source: .
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=gdtk-non-free-${{ matrix.arch }}
            *.cache-to=type=gha,mode=max,scope=gdtk-non-free-${{ matrix.arch }}
            gdtk-non-free.tags=ghcr.io/${{ github.repository_owner }}/gdtk-non-free:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.sha, matrix.arch) || format('sha-{0}-{1}', github.sha, matrix.arch) }}
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/

      - name: Run Smoke Tests (gdtk-non-free)
        if: github.event_name == 'pull_request'
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/
          IMAGES_TAG: pr-${{ github.sha }}-${{ matrix.arch }}
        run: task test:non-free

      - name: Run Trivy Vulnerability Scanner (gdtk-non-free)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gdtk-non-free:${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.sha, matrix.arch) || format('sha-{0}-{1}', github.sha, matrix.arch) }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'

  merge-gdtk-non-free:
    name: Merge Multi-Arch Manifest (gdtk-non-free)
    needs: build-gdtk-non-free
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and Push Multi-Arch Manifest (gdtk-non-free)
        env:
          PREFIX: ghcr.io/${{ github.repository_owner }}/gdtk-non-free
          SHA_TAG: sha-${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          ARGS=(-t "${PREFIX}:latest")
          if [ -n "$RELEASE_TAG" ]; then
            ARGS+=(-t "${PREFIX}:${RELEASE_TAG}")
          fi
          docker buildx imagetools create "${ARGS[@]}" \
            "${PREFIX}:${SHA_TAG}-amd64" \
            "${PREFIX}:${SHA_TAG}-arm64"

  release-bom:
    name: Publish Release BOM
    needs: [merge-gdtk, merge-gdtk-non-free]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Append Tool BOM to Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          BAKE_JSON=$(docker buildx bake -f docker-bake.hcl --print gdtk gdtk-non-free)
          TILED_VERSION=$(printf '%s\n' "$BAKE_JSON" | jq -er '.target.gdtk.args.tiled_version | select(type == "string" and length > 0)')
          TILE_EXTRUDER_VERSION=$(printf '%s\n' "$BAKE_JSON" | jq -er '.target.gdtk.args.tile_extruder_version | select(type == "string" and length > 0)')
          YAML_VERSION=$(printf '%s\n' "$BAKE_JSON" | jq -er '.target.gdtk.args.yaml_version | select(type == "string" and length > 0)')
          ASEPRITE_GIT_REF=$(printf '%s\n' "$BAKE_JSON" | jq -er '.target["gdtk-non-free"].contexts["aseprite-upstream"] | select(type == "string" and length > 0) | sub("@[a-z0-9]+:[a-fA-F0-9]+$"; "") | sub("^.*:"; "") | sub("-headless$"; "") | select(length > 0)')

          cat <<EOF > bom.md

          ### Contained Tools & Bill of Materials (BOM)
          | Tool | Version | CLI Binary | Tier | License |
          | :--- | :--- | :--- | :--- | :--- |
          | **Tiled** | ${TILED_VERSION} (\`amd64\` AppImage) / Ubuntu 26.04 LTS \`apt\` (\`arm64\`) | \`tiled\` | Free (\`gdtk\`) | GPL-2.0-or-later |
          | **tile-extruder** | ${TILE_EXTRUDER_VERSION} | \`tile-extruder\` | Free (\`gdtk\`) | MIT |
          | **yaml** | ${YAML_VERSION} | \`yaml\` | Free (\`gdtk\`) | Apache-2.0 |
          | **Aseprite** | ${ASEPRITE_GIT_REF} | \`aseprite\`, \`ase\` | Non-Free (\`gdtk-non-free\`) | EULA (Proprietary) |
          EOF
          gh release view "$TAG_NAME" --json body -q .body > existing_body.md || true
          cat existing_body.md bom.md > updated_body.md
          gh release edit "$TAG_NAME" --notes-file updated_body.md

  notify:
    name: Discord CI Notification
    needs: [lint, build-gdtk, merge-gdtk, build-gdtk-non-free, merge-gdtk-non-free, release-bom]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (#dev-ci-builds)
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: No DISCORD_CI_WEBHOOK configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=4388484
            STATUS_ICON="✅"
            TITLE="CI Build Passed: $REPO_NAME"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15088454
            STATUS_ICON="❌"
            TITLE="CI Build Failed: $REPO_NAME"
          else
            COLOR=13202208
            STATUS_ICON="⚠️"
            TITLE="CI Build Cancelled: $REPO_NAME"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          RUN_URL="$SERVER_URL/$REPO_NAME/actions/runs/$RUN_ID"
          COMMIT_URL="$SERVER_URL/$REPO_NAME/commit/$COMMIT_SHA"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          PAYLOAD=$(jq -n \
            --arg title "$STATUS_ICON $TITLE" \
            --argjson color "$COLOR" \
            --arg desc "GitHub Actions workflow completed for branch \`$BRANCH_NAME\`." \
            --arg run_url "$RUN_URL" \
            --arg repo "\`$REPO_NAME\`" \
            --arg branch "\`$BRANCH_NAME\`" \
            --arg actor "@$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg commit "[\`$SHORT_SHA\`]($COMMIT_URL)" \
            --arg run_link "[View Run]($RUN_URL)" \
            --arg ts "$TIMESTAMP" \
            '{
              username: "kidthales CI/CD",
              avatar_url: "https://github.com/kidthales.png",
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                url: $run_url,
                author: {
                  name: "kidthales Systems CI",
                  icon_url: "https://github.com/kidthales.png"
                },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Triggered By", value: $actor, inline: true },
                  { name: "Workflow", value: $workflow, inline: true },
                  { name: "Commit", value: $commit, inline: true },
                  { name: "Run Details", value: $run_link, inline: true }
                ],
                footer: {
                  text: "kidthales Automation • Antigravity",
                  icon_url: "https://github.com/kidthales.png"
                },
                timestamp: $ts
              }]
            }')

          curl -s -S -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" > /dev/null || echo "Warning: Discord webhook dispatch failed."
