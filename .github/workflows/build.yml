name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
  workflow_dispatch: ~
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ !github.event.pull_request.head.repo.fork }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Task Lint
        run: task lint

  build-gdtk:
    name: Build Free Toolkit (gdtk) and Push to ghcr.io/${{ github.repository_owner }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          targets: gdtk
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          source: .
          set: |
            *.cache-from=type=gha,scope=gdtk
            *.cache-to=type=gha,mode=max,scope=gdtk
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/
          IMAGES_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

      - name: Run Trivy Vulnerability Scanner (gdtk)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gdtk:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'

  build-gdtk-non-free:
    name: Build Non-Free Toolkit (gdtk-non-free) and Push to ghcr.io/${{ github.repository_owner }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@v7
        with:
          targets: gdtk-non-free
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          source: .
          set: |
            *.cache-from=type=gha,scope=gdtk-non-free
            *.cache-to=type=gha,mode=max,scope=gdtk-non-free
        env:
          IMAGES_PREFIX: ghcr.io/${{ github.repository_owner }}/
          IMAGES_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

      - name: Run Trivy Vulnerability Scanner (gdtk-non-free)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gdtk-non-free:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          severity: 'CRITICAL'

  release-bom:
    name: Publish Release BOM
    needs: [build-gdtk, build-gdtk-non-free]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Append Tool BOM to Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          cat << 'EOF' > bom.md

          ### Contained Tools & Bill of Materials (BOM)
          | Tool | Version | CLI Binary | Tier | License |
          | :--- | :--- | :--- | :--- | :--- |
          | **Tiled** | 1.12.2 | `tiled` | Free (`gdtk`) | GPL-2.0-or-later |
          | **tile-extruder** | 2.1.1 | `tile-extruder` | Free (`gdtk`) | MIT |
          | **yaml** | 2.9.1 | `yaml` | Free (`gdtk`) | Apache-2.0 |
          | **Aseprite** | v1.3.18.6 | `aseprite`, `ase` | Non-Free (`gdtk-non-free`) | EULA (Proprietary) |
          EOF
          gh release view "$TAG_NAME" --json body -q .body > existing_body.md || true
          cat existing_body.md bom.md > updated_body.md
          gh release edit "$TAG_NAME" --notes-file updated_body.md

  notify:
    name: Discord CI Notification
    needs: [lint, build-gdtk, build-gdtk-non-free]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord (#dev-ci-builds)
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          JOB_STATUS: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Warning: No DISCORD_CI_WEBHOOK configured. Skipping notification."
            exit 0
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=4388484
            STATUS_ICON="✅"
            TITLE="CI Build Passed: $REPO_NAME"
          elif [ "$JOB_STATUS" = "failure" ]; then
            COLOR=15088454
            STATUS_ICON="❌"
            TITLE="CI Build Failed: $REPO_NAME"
          else
            COLOR=13202208
            STATUS_ICON="⚠️"
            TITLE="CI Build Cancelled: $REPO_NAME"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          RUN_URL="$SERVER_URL/$REPO_NAME/actions/runs/$RUN_ID"
          COMMIT_URL="$SERVER_URL/$REPO_NAME/commit/$COMMIT_SHA"
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          PAYLOAD=$(jq -n \
            --arg title "$STATUS_ICON $TITLE" \
            --argjson color "$COLOR" \
            --arg desc "GitHub Actions workflow completed for branch \`$BRANCH_NAME\`." \
            --arg run_url "$RUN_URL" \
            --arg repo "\`$REPO_NAME\`" \
            --arg branch "\`$BRANCH_NAME\`" \
            --arg actor "@$ACTOR" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg commit "[\`$SHORT_SHA\`]($COMMIT_URL)" \
            --arg run_link "[View Run]($RUN_URL)" \
            --arg ts "$TIMESTAMP" \
            '{
              username: "kidthales CI/CD",
              avatar_url: "https://github.com/kidthales.png",
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                url: $run_url,
                author: {
                  name: "kidthales Systems CI",
                  icon_url: "https://github.com/kidthales.png"
                },
                fields: [
                  { name: "Repository", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Triggered By", value: $actor, inline: true },
                  { name: "Workflow", value: $workflow, inline: true },
                  { name: "Commit", value: $commit, inline: true },
                  { name: "Run Details", value: $run_link, inline: true }
                ],
                footer: {
                  text: "kidthales Automation • Antigravity",
                  icon_url: "https://github.com/kidthales.png"
                },
                timestamp: $ts
              }]
            }')

          curl -s -S -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL" > /dev/null || echo "Warning: Discord webhook dispatch failed."
