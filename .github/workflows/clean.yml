name: Clean

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Simulate cleanup without deleting images'
        type: boolean
        required: false
        default: true
  schedule:
    # UTC: Daily at 04:20
    - cron: 20 4 * * *

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ghcr-cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune Untagged & Obsolete GHCR Images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: gdtk,gdtk-non-free
          delete-untagged: true
          older-than: 30 days
          delete-tags: '.*'
          use-regex: true
          exclude-tags: '^(latest|v?[0-9]+\.[0-9]+\.[0-9]+.*)$'
          dry-run: ${{ inputs.dry-run || false }}
